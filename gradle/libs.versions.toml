material = "1.12.0"
constraintlayout = "2.2.0"

activity = "1.10.1"
glide = "4.16.0"
gson = "2.13.0"
java = "VERSION_1_8"

# Build constants
koinAndroid = "3.5.0"
kotlinxCoroutinesAndroid = "1.7.3"
minSdk = "26"
compileSdk = "35"
mpandroidchart = "v3.1.0"
retrofit = "2.11.0"
okhttp3 = "4.12.0"
roomVersion = "2.7.0"
targetSdk = "33"

legacySupportV4 = "1.0.0"
lifecycleLivedataKtx = "2.8.7"
lifecycleViewmodelKtx = "2.8.7"
fragmentKtx = "1.8.6"
